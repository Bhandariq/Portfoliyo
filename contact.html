<body>

  <span>.</span><span>.</span><span>.</span><span>.</span><span>.</span>

<!-- CONTACT SECTION -->
<section class="contact">
  <h1>GET IN TOUCH</h1>
  <h2>Contact.</h2>

  <!-- IMPORTANT -->
  <form id="contact-form" class="contact-form" onsubmit="return false;">

    <label>Your Name</label>
    <input type="text" name="name" required>

    <label>Your Email</label>
    <input type="email" name="email" required>

    <label>Your Message</label>
    <textarea name="message" rows="6" required></textarea>

    <!-- Button type changed -->
    <button id="send-btn" type="button">Send</button>

  </form>

  <div class="contact-info">
    <p>Email:
      <a href="mailto:rohitbhandari028@gmail.com">
        rohitbhandari028@gmail.com
      </a>
    </p>
  </div>
</section>

<footer>
  <p>© 2025 Rohit Singh Bhandari | Full Stack Developer (MERN)</p>
</footer>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  // INIT EMAILJS
  emailjs.init("xD4U6cqMRctj6Mid0");

  const form = document.getElementById("contact-form");
  const button = document.getElementById("send-btn");

  // CLICK EVENT (MORE RELIABLE THAN SUBMIT)
  button.addEventListener("click", function () {

    button.disabled = true;
    button.textContent = "Sending...";

    emailjs.sendForm(
      "service_ugg0pr7",
      "template_1ctpapr",
      form
    )
    .then(function () {
      alert("✅ Message sent successfully!");
      form.reset();
    })
    .catch(function (error) {
      console.error("EmailJS ERROR:", error);
      alert("❌ Failed to send message");
    })
    .finally(function () {
      button.disabled = false;
      button.textContent = "Send";
    });

  });

});
</script>

</body>
</html>
