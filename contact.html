<body>

  <!-- Navbar -->

  <!-- Background Particles -->
  <div class="particles">
    <span>.</span><span>.</span><span>.</span><span>.</span><span>.</span>

  <!-- Contact Section -->
  <section class="contact">
    <h1>GET IN TOUCH</h1>
    <h2>Contact.</h2>

    <!-- ✅ IMPORTANT: FORM ID ADDED -->
    <form id="contact-form" class="contact-form">

      <label>Your Name</label>
      <input type="text" name="name" placeholder="What's your good name?" required>

      <label>Your Email</label>
      <input type="email" name="email" placeholder="What's your email address?" required>

      <label>Your Message</label>
      <textarea name="message" rows="6" placeholder="What you want to say?" required></textarea>

      <button type="submit">Send</button>

    </form>

    <div class="contact-info">
      <p>Email:
        <a href="mailto:rohitbhandari028@gmail.com">
          rohitbhandari028@gmail.com
        </a>
      </p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 Rohit Singh Bhandari | Full Stack Developer (MERN)</p>
  </footer>


  <!-- ✅ EMAILJS SCRIPT (MUST BE AT BOTTOM) -->
  <!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  // Initialize EmailJS
  emailjs.init("xD4U6cqMRctj6Mid0");

  const form = document.getElementById("contact-form");
  const button = form.querySelector("button");

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    // Show sending state
    button.disabled = true;
    button.textContent = "Sending...";

    emailjs.sendForm(
  "service_1bt3yrb",
  "template_1ctpapr",
  form
)
    
    
    .then(function () {
      alert("✅ Message sent successfully!");
      form.reset();
    })
    .catch(function (error) {
      alert("❌ Failed to send message");
      console.log("EmailJS Error:", error);
    })
    .finally(function () {
      button.disabled = false;
      button.textContent = "Send";
    });

  });

});
</script>

</body>
</html>
